<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Drone Panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322d3ee'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%230d1117' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230d1117'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app"><div class="boot"><div style="display:grid;gap:18px;justify-items:center"><img src="logo.png" alt="" style="width:200px;height:auto" />Connecting to drone…</div></div></div>
  <script>
    // Show script errors on screen instead of a blank page
    function dpErr(msg) {
      var b = document.getElementById('dp-err') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'dp-err' }));
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:40vh;overflow:auto;background:#2a1416;color:#fecaca;border:1px solid #5b2b2b;border-radius:8px;padding:10px;font:12px monospace;z-index:999;white-space:pre-wrap;margin:0';
      b.textContent += msg + '\n';
    }
    window.addEventListener('error', function (e) { dpErr('Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
    window.addEventListener('unhandledrejection', function (e) { dpErr('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
